name: Release

# Pushing a `vX.Y.Z` tag publishes the GitHub release for it, then the crate to crates.io
# through Trusted Publishing. Both are the organisation's shared workflows; the procedure
# is in https://github.com/anaxo-io/.github/blob/main/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # Trusted Publishing: GitHub proves this workflow's identity to crates.io

jobs:
  release:
    uses: anaxo-io/.github/.github/workflows/release-rust.yml@main
  publish:
    needs: release
    uses: anaxo-io/.github/.github/workflows/publish-rust.yml@main
    permissions:
      contents: read
      id-token: write
