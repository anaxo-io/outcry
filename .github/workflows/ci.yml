name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Which jobs need to run. Doc-only changes cannot affect a compiler, so rebuilding the
  # crate six ways to check a typo is pure waiting.
  #
  # This gates each job with `if:` rather than putting `paths-ignore:` on the triggers
  # above, and the difference matters: a workflow skipped by a path filter never reports
  # its checks at all, and required checks that never report block a pull request forever.
  # A job skipped by `if:` does report, as skipped, which branch protection accepts.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Anything that is not a pull request — a push to main, a merge queue entry —
          # runs everything. Only a pull request has two ends to compare.
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: running everything"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "changed files:"; echo "$changed"
          # Prose only: markdown, licences and the issue/PR templates. Note what is *not*
          # here — Cargo.toml, deny.toml, rust-toolchain.toml, anything under src/, tests/
          # or benches/, and the workflows themselves.
          if echo "$changed" | grep -qvE '^([^/]*\.md|LICENSE-[A-Z0-9-]+|\.github/(ISSUE_TEMPLATE/.*|PULL_REQUEST_TEMPLATE\.md))$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "prose only: skipping the build jobs"
          fi

  lint:
    name: fmt + clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo bench --no-run

  miri:
    # The sound copy path must be free of undefined behaviour under the Rust abstract
    # machine. Miri cannot map files, so only the anonymous-memory tests run here.
    name: miri (sound copy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # rust-toolchain.toml pins stable, which would override the nightly installed above.
      - run: rm -f rust-toolchain.toml
      - run: cargo miri setup
      - run: cargo miri test --lib
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
      - run: cargo miri test --test behaviour -- --skip file_backed --skip open_rejects
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  docs:
    name: rustdoc
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  msrv:
    name: msrv (1.89)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: rm -f rust-toolchain.toml
      - run: cargo check --all-features

  deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
